<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="bin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Verde Profissional -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />

  <!-- Sombra da Caçamba -->
  <path d="M 98 205 L 148 372 C 152 382, 161 388, 172 388 L 340 388 C 351 388, 360 382, 364 372 L 414 205 Z" fill="#0a2a16" opacity="0.35" transform="translate(0, 10)" />

  <!-- Corpo Principal da Caçamba -->
  <path d="M 96 195 L 148 368 C 152 378, 161 384, 172 384 L 340 384 C 351 384, 360 378, 364 368 L 416 195 Z" fill="url(#bin)" />

  <!-- Borda Superior Reforçada -->
  <rect x="76" y="170" width="360" height="34" rx="12" fill="#ffffff" />

  <!-- Faixa Refletiva Amarela Central -->
  <path d="M 121 250 L 131 282 L 381 282 L 391 250 Z" fill="url(#accent)" />

  <!-- Nervuras Verticais de Reforço -->
  <rect x="206" y="218" width="12" height="142" rx="6" fill="#cbd5e1" opacity="0.85" />
  <rect x="250" y="218" width="12" height="142" rx="6" fill="#cbd5e1" opacity="0.85" />
  <rect x="294" y="218" width="12" height="142" rx="6" fill="#cbd5e1" opacity="0.85" />

  <!-- Pinos Laterais de Içamento -->
  <rect x="64" y="260" width="30" height="18" rx="6" fill="#facc15" />
  <circle cx="76" cy="269" r="6" fill="#ffffff" />
  <rect x="418" y="260" width="30" height="18" rx="6" fill="#facc15" />
  <circle cx="436" cy="269" r="6" fill="#ffffff" />
</svg>
